name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      # Offline: Jev and Claude run against fakes, so no API keys are needed. The spaCy test
      # skips because models/ is not committed (training takes minutes and downloads datasets).
      - run: uv run pytest -q -rs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # scan the whole history, not just the tip
      - uses: trufflesecurity/trufflehog@v3.97.5
        with:
          extra_args: --results=verified,unknown
