# Swedish variant of textcat_base.cfg: Swedish tokenizer, and the CNN also reads the 300-d word
# vectors from sv_core_news_md (spaCy's pretrained Swedish pipeline). CPU-only.
# `train_spacy.py` fills in the rest with `spacy init fill-config`.

[paths]
train = null
dev = null

[system]
seed = 0

[nlp]
lang = "sv"
pipeline = ["textcat"]
batch_size = 1000

[components]

[components.textcat]
factory = "textcat"

[components.textcat.model]
@architectures = "spacy.TextCatEnsemble.v2"
nO = null

[components.textcat.model.linear_model]
@architectures = "spacy.TextCatBOW.v3"
exclusive_classes = true
ngram_size = 2
no_output_layer = false
length = 262144

[components.textcat.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.textcat.model.tok2vec.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = 64
rows = [2000, 2000, 500, 1000, 500]
attrs = ["NORM", "LOWER", "PREFIX", "SUFFIX", "SHAPE"]
include_static_vectors = true

[components.textcat.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 64
window_size = 1
maxout_pieces = 3
depth = 2

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
max_epochs = 6
patience = 2000
eval_frequency = 200

[training.score_weights]
cats_macro_f = 1.0

[initialize]
vectors = "sv_core_news_md"
